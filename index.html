<script>

$('#rt').onchange=setRatio;$('#q').onchange=setRatio;$('#fs').onclick=()=>cv.requestFullscreen&&cv.requestFullscreen();setRatio();
// Importar

function del(){push();const c=cur();if(!c)return;clips=clips.filter(x=>x!==c);sel=clips[0]?.id;$('#empty').hidden=!!clips.length;tl();pn()}
function mv(d){push();const c=cur(),i=clips.indexOf(c),j=i+d;if(!c||j<0||j>=clips.length)return;[clips[i],clips[j]]=[clips[j],clips[i]];tl()}
const snap=()=>({c:clips.map(c=>({...c})),x:texts.map(x=>({...x})),o:ovs.map(c=>({...c}))});
function push(){hist.push(snap());if(hist.length>50)hist.shift();fut=[]}
function load(q){clips=q.c;texts=q.x;ovs=q.o;if(!clips.find(c=>c.id==sel))sel=clips[0]?.id;$('#empty').hidden=!!clips.length;tl();pn()}
$('#un').onclick=()=>{if(hist.length){fut.push(snap());load(hist.pop())}};
$('#re').onclick=()=>{if(fut.length){hist.push(snap());load(fut.pop())}};
function addAud(f,o,n){const a=new Audio(URL.createObjectURL(f));aud.push({a,g:node(a),vol:1,o,n,f});pn()}

const oc=document.createElement('canvas'),ox=oc.getContext('2d',{willReadFrequently:true});

let seg=null,segMask=null,segBusy=false,segLoad=false;
const gc=document.createElement('canvas'),gx=gc.getContext('2d'),hc=document.createElement('canvas'),hx=hc.getContext('2d');
function loadSeg(){if(segLoad)return;segLoad=true;const q=document.createElement('script');q.src='seg_selfie_segmentation.js';
 q.onload=async()=>{try{const m=new SelfieSegmentation({locateFile:f=>'seg_'+f});m.setOptions({modelSelection:1});m.onResults(r=>{segMask=r.segmentationMask;segBusy=false});await m.initialize();seg=m}catch(x){segLoad=false;alert('No se pudo iniciar el modelo de fondo')}};

function cutImg(e,sw,sh){if(!seg){loadSeg();return e}const k=Math.min(1,640/Math.max(sw,sh)),w=Math.round(sw*k),h=Math.round(sh*k);
 gc.width=w;gc.height=h;gx.drawImage(e,0,0,w,h);if(!segBusy){segBusy=true;seg.send({image:gc}).catch(()=>segBusy=false)}
 if(!segMask)return e;hc.width=w;hc.height=h;hx.drawImage(e,0,0,w,h);hx.globalCompositeOperation='destination-in';hx.drawImage(segMask,0,0,w,h);hx.globalCompositeOperation='source-over';return hc}

function syncOv(){ovs.forEach(o=>{const w=t-o.s,on=w>=0&&w<len(o);if(o.g)o.g.gain.value=on?o.vol:0;if(o.type!='v')return;if(!on){if(!o.el.paused)o.el.pause();return}const want=o.in+w;if(Math.abs(o.el.currentTime-want)>(playing?.35:.03))o.el.currentTime=want;if(playing&&o.el.paused)o.el.play().catch(()=>{});if(!playing&&!o.el.paused)o.el.pause()})}
function cvEl(c){const r=document.createElement('div');r.className='row';r.append('Curva ',...[['Normal',0],['Montaña',1],['Bala',-1]].map(([n,v])=>B(n,()=>{push();c.cv=v;pn()},(c.cv||0)==v)));return r}
const idb=()=>new Promise((ok,no)=>{const q=indexedDB.open('corte',1);q.onupgradeneeded=()=>q.result.createObjectStore('p');q.onsuccess=()=>ok(q.result);q.onerror=no});
const strip=({el,g,...r})=>r;
async function guardar(){try{const d=await idb(),x={rt:$('#rt').value,c:clips.map(strip),x:texts,o:ovs.map(strip),a:aud.map(({a,g,...r})=>r),uid},q=d.transaction('p','readwrite');q.objectStore('p').put(x,'1');q.oncomplete=()=>alert('Proyecto guardado en este dispositivo');q.onerror=()=>alert('No se pudo guardar')}catch(e){alert('Guardado no disponible aquí')}}

const TP={Vlog:{r:'9,16',fil:'Vivo',ent:'Zoom',sal:'Fundido',fx:'Pulso',t:'Mi vlog',f:'Impact'},Cine:{r:'16,9',fil:'Desvaído',ent:'Fundido',sal:'Fundido',fx:'Viñeta',t:'Título',f:'Georgia'},'Retro VHS':{r:'4,5',fil:'Sepia',ent:'Deslizar',sal:'Fundido',fx:'VHS',t:'REC ●',f:'"Courier New"'},Fiesta:{r:'9,16',fil:'Cálido',ent:'Giro',sal:'Zoom',fx:'Destello',t:'¡Fiesta! 🎉',f:'Impact'}};
function plantilla(n){const q=TP[n];push();$('#rt').value=q.r;setRatio();clips.forEach(c=>{c.fil=q.fil;c.ent=q.ent;c.sal=q.sal;c.fx=q.fx});addT(q.t,72);const x=texts[texts.length-1];x.font=q.f;x.s=0;x.e=3;x.y=.15;x.an='Pop';tl();pn()}
function addMus(e){ac();const f=e.target.files[0];if(f)addAud(f,0,f.name.slice(0,18))}
let vr=null;
async function voz(){ac();if(vr){vr.stop();return}try{const m=await navigator.mediaDevices.getUserMedia({audio:true}),ch=[],o=t;vr=new MediaRecorder(m);vr.ondataavailable=e=>ch.push(e.data);vr.onstop=()=>{m.getTracks().forEach(x=>x.stop());vr=null;pause();addAud(new Blob(ch,{type:'audio/webm'}),o,'Voz')};vr.start();play();pn()}catch(x){alert('No hay acceso al micrófono')}}
// Reproducción
function play(){if(!clips.length)return;ac();if(t>=total()-.05)t=0;playing=true;last=performance.now();}
function pause(){playing=false}
$('#pl').onclick=()=>playing?pause():play();
function sync(){syncOv();const k=at(t);
 clips.forEach(c=>{if(c.g)c.g.gain.value=0;if(c.type=='v'&&(!k||c.el!==k.c.el)&&!c.el.paused)c.el.pause()});
 aud.forEach(m=>{m.g.gain.value=m.vol;const w=t-m.o;if(playing&&w>=0&&w<(m.a.duration||1e9)){if(m.a.paused){m.a.currentTime=w;m.a.play().catch(()=>{})}else if(Math.abs(m.a.currentTime-w)>.4)m.a.currentTime=w}else if(!m.a.paused)m.a.pause()});
 if(!k)return;const c=k.c;if(c.type!='v')return;c.g.gain.value=c.vol;

 if(playing&&c.el.paused)c.el.play().catch(()=>{});if(!playing&&!c.el.paused)c.el.pause()}
function draw(){cx.fillStyle='#000';cx.fillRect(0,0,W,H);const k=at(t);
 if(k){const c=k.c,e=c.el,sw=c.type=='v'?e.videoWidth:e.naturalWidth,sh=c.type=='v'?e.videoHeight:e.naturalHeight;
  if(sw){const o=t-k.s,f=(c.cov?Math.max:Math.min)(W/sw,H/sh),dw=sw*f,dh=sh*f,a=Math.min(1,o/.6),b=Math.min(1,(k.l-o)/.6);const u=o/k.l,kk=c.kf;let z=kk?c.z+(c.z2-c.z)*u:c.z,PX=kk?c.px+(c.px2-c.px)*u:c.px,PY=kk?c.py+(c.py2-c.py)*u:c.py,al=1,dx=0,rot=c.rot,sx=0,sy=0;
  if(c.ent=='Fundido')al*=a;if(c.ent=='Zoom'){z*=.6+.4*a;al*=a}if(c.ent=='Deslizar')dx=-(1-a)*W;if(c.ent=='Giro'){rot+=(1-a)*180;al*=a}

  cx.save();cx.globalAlpha=Math.max(0,al);cx.translate(W/2+dx+PX*W+sx,H/2+PY*H+sy);cx.rotate(rot*Math.PI/180);cx.scale(z*(c.flip?-1:1),z);cx.filter=(FIL[c.fil]||'')+` brightness(${c.b}) contrast(${c.c}) saturate(${c.s})`+(c.bl?` blur(${c.bl}px)`:'');cx.drawImage(c.rm?cutImg(e,sw,sh):e,-dw/2,-dh/2,dw,dh);cx.restore();cx.filter='none';

 ovs.forEach(o=>{if(t>=o.s&&t<o.s+len(o))drawOv(o)});cx.textAlign='center';cx.textBaseline='middle';cx.lineJoin='round';
